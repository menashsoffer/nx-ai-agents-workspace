name: Demo · Build
on:
  issues:
    types: [labeled]
  workflow_dispatch:
jobs:
  build:
    if: ${{ github.event.label.name == 'stage:ready' && !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        run: |
          gh pr create --title "t" --body-file body.md
          node .github/scripts/pipeline.mjs upsert-comment "$N" result body.md
          node .github/scripts/pipeline.mjs set-stage "$N" stage:built
      - name: Needs help
        run: |
          node .github/scripts/pipeline.mjs outcome "$N" outcome.json
