# D7 (docs/security.md): keep npm packages and pinned Action SHAs current.
# 7-day cooldown: longer than pnpm's 3-day minimumReleaseAge (D6), so update PRs only propose well-aged releases.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      nx:
        patterns: ['nx', '@nx/*']
      storybook:
        patterns: ['storybook', '@storybook/*']
      react:
        patterns:
          [
            'react',
            'react-dom',
            'react-router',
            '@types/react',
            '@types/react-dom',
          ]
      vite-vitest:
        patterns:
          [
            'vite',
            'vitest',
            '@vitest/*',
            '@vitejs/*',
            '@tailwindcss/*',
            'tailwindcss',
          ]
      lint-format:
        patterns:
          [
            'eslint*',
            '@eslint/*',
            'typescript-eslint',
            '@typescript-eslint/*',
            'prettier',
            'knip',
          ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
