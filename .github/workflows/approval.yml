name: Pipeline · Approval

# Review gates and the hand-off to humans. For a PR's head commit this
# evaluates the gates (CI, the Gemini security review clean or every finding
# dispositioned, review threads resolved, the Copilot review when it is
# required, and for a pipeline PR with protected paths the owner's approval
# of this head) and sets the `pipeline/gates` commit status, a required check
# of the main ruleset. When CI is green, the security review passes and no
# review thread is open, and once every gate holds: label
# stage:human-approval, mark the PR ready (this requests CODEOWNERS) and
# comment the preview URL.
#
# The Copilot review is OPTIONAL and off by default (the repo needs a
# Copilot licence). It is on only when the repo variable REQUIRE_COPILOT is
# exactly `true`; unset, empty or anything else (`TRUE`, `1`, `false`) is
# off. Off: the Copilot gate reads "not required", no review is requested
# and the PR goes straight to human approval. On: the review is requested
# (REST, once per head commit) after CI, security and threads hold, and the
# hand-off waits for Copilot to review that commit. To turn it on, set
# REQUIRE_COPILOT to `true` and either give COPILOT_REVIEW_TOKEN a
# Copilot-licensed user's token or enable automatic Copilot review on the
# repo. Copilot threads that appear while it is off still count as review
# threads.
# Merging stays with a human: the main ruleset requires a code-owner
# approval, and no agent or bot is a code owner or bypass actor.
# docs/pipeline.md, "Review gates and dispositions".
on: # zizmor: ignore[dangerous-triggers]
  # Posted by security.yml (App token, so it triggers workflows).
  status:
  pull_request_review:
    types: [submitted]
  # The bot's disposition record note (disposition.yml, App token) and its
  # protected-approval record on the PR (protected-approve.yml).
  issue_comment:
    types: [created]
  # A new head has no gates status yet: give it a pending one at once.
  # Runs the default branch's workflow, reads nothing from the run.
  workflow_run:
    workflows: [CI]
    types: [requested]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

permissions: {}

jobs:
  resolve:
    # Skips until the pipeline App is configured (docs/pipeline.md).
    if: >-
      vars.PIPELINE_APP_CLIENT_ID != '' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      vars.PIPELINE_BOT_LOGIN != '' &&
      github.event.comment.user.login == vars.PIPELINE_BOT_LOGIN &&
      (startsWith(github.event.comment.body, '<!-- pipeline:disposition') ||
      startsWith(github.event.comment.body, '<!-- pipeline:protected-approved'))) ||
      (github.event_name == 'status' && github.event.context == 'pipeline/security'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          SHA: ${{ github.event.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == "issue_comment" ]]; then
            # A comment carries no head repo: only open same-repo PRs count.
            gh api "repos/$GITHUB_REPOSITORY/pulls/$N" \
              | jq -e --arg repo "$GITHUB_REPOSITORY" '.state == "open" and .head.repo.full_name == $repo' > /dev/null || N=""
          fi
          if [[ -z "$N" && "$EVENT" == "status" ]]; then
            # status event: find the open same-repo PR whose head is this commit.
            N=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
              --jq "[.[] | select(.state == \"open\" and .head.sha == \"$SHA\" and .head.repo.full_name == \"$GITHUB_REPOSITORY\")][0].number // empty")
          fi
          echo "pr=$N" >> "$GITHUB_OUTPUT"

  approval:
    needs: resolve
    if: ${{ needs.resolve.outputs.pr != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Shared with fix.yml's adapter: both read-modify-write the state comment.
    concurrency:
      group: pipeline-pr-${{ needs.resolve.outputs.pr }}-state
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PIPELINE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          # contents: read lists the PR's changed files (protected paths).
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write
          permission-checks: read
          permission-statuses: write

      # Sets `pipeline/gates` on the head, whatever the gates say.
      - name: Evaluate gates and hand off
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          # Requesting Copilot needs a token of a user with Copilot access;
          # falls back to the App token when unset.
          COPILOT_GH_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN }}
          PIPELINE_BOT_LOGIN: ${{ vars.PIPELINE_BOT_LOGIN }}
          PIPELINE_OWNER_LOGIN: ${{ vars.PIPELINE_OWNER_LOGIN }}
          # Only the exact string `true` turns the Copilot gate on.
          REQUIRE_COPILOT: ${{ vars.REQUIRE_COPILOT }}
          PR: ${{ needs.resolve.outputs.pr }}
        run: node .github/scripts/pipeline.mjs approval "$PR"

  # `pipeline/gates` is a required check, so a head without it cannot merge.
  # This posts it as pending the moment CI is requested for a same-repo PR,
  # so the PR shows why it is waiting. Never overwrites an existing status.
  pending:
    if: >-
      vars.PIPELINE_APP_CLIENT_ID != '' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pipeline-pr-${{ github.event.workflow_run.pull_requests[0].number }}-gates-pending
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PIPELINE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          permission-pull-requests: read
          permission-statuses: write

      - name: Post pipeline/gates as pending
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REQUIRE_COPILOT: ${{ vars.REQUIRE_COPILOT }}
          N: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: node .github/scripts/pipeline.mjs gates-pending "$N" "$SHA"
