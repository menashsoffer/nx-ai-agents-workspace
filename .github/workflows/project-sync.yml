name: Pipeline · Project sync

# Labels are the source of truth. Every stage:* label change on an issue or
# PR sets the Project "Status" column to match (adding the item if needed).
# stage:inbox is handled by inbox.yml. Moving cards by hand does not change
# labels: change the label instead.
on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  sync:
    if: >-
      vars.PROJECT_URL != '' &&
      startsWith(github.event.label.name, 'stage:') &&
      github.event.label.name != 'stage:inbox' &&
      (github.event_name == 'issues' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pipeline-${{ github.event_name == 'issues' && 'issue' || 'pr' }}-${{ github.event.issue.number || github.event.pull_request.number }}-project
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Set Status from label
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_URL: ${{ vars.PROJECT_URL }}
          CONTENT_ID: ${{ github.event.issue.node_id || github.event.pull_request.node_id }}
          LABEL: ${{ github.event.label.name }}
        run: node .github/scripts/pipeline.mjs project-status --project-url "$PROJECT_URL" --content-id "$CONTENT_ID" --status "$LABEL"
