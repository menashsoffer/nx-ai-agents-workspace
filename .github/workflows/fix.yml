name: Pipeline · Fix

# Review feedback -> bounded automated fix loop.
#   adapter (deterministic): collect actionable review comments newer than
#     the <!-- pipeline-state --> comment, dedupe by comment id, then
#     no fix-loop label -> fix-loop:1 + fix; fix-loop:1 -> fix-loop:2 + fix;
#     fix-loop:2 -> outcome note (budget_exhausted) + stage:routing, stop.
#     No new comments -> no-op. With `retry` (dispatched by router.yml
#     after a failed fixer), replays the last round's items under the
#     current fix-loop label instead of starting a new round.
#   Pipeline PRs only (opened by the pipeline App on issue-<n>-<slug>), and
#   only feedback from the pipeline, Copilot or repo owners/members/collaborators.
#   fix (agent, Gemini, read-only token, no shell): edit the working tree only.
#   verify (deterministic, no secrets): apply the patch, format, run pnpm verify.
#   push (deterministic): check the patch, commit, push, reply to threads.
#   A fix patch never carries protected paths, approvable ones included: it
#   moves the branch head and an owner approval covers one head only, so
#   pushing it would run unapproved protected content in CI on an open PR.
#   It is refused before any push (protected_approval_needed or
#   forbidden_path, both hard gates for a human).
#   report: on a failure, an outcome note + stage:routing for the router.
on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number
      retry:
        description: Replay the last fix round (set by router.yml)
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  adapter:
    # Skips until the pipeline App is configured (docs/pipeline.md).
    # Reviews count only on PRs the pipeline App opened; the adapter
    # re-checks author and branch, which also covers workflow_dispatch.
    if: >-
      vars.PIPELINE_APP_CLIENT_ID != '' && vars.PIPELINE_BOT_LOGIN != '' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == vars.PIPELINE_BOT_LOGIN))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Shared with approval.yml: both read-modify-write the state comment.
    concurrency:
      group: pipeline-pr-${{ github.event.pull_request.number || inputs.pr }}-state
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      action: ${{ steps.adapter.outputs.action }}
      loop: ${{ steps.adapter.outputs.loop }}
      pr: ${{ steps.pr.outputs.pr }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PIPELINE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-issues: write

      - id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          gh pr view "$N" --repo "$GITHUB_REPOSITORY" --json number,state,headRefName,headRefOid,isCrossRepository > pr.json
          if [[ "$(jq -r .state pr.json)" != "OPEN" || "$(jq -r .isCrossRepository pr.json)" == "true" ]]; then
            echo "::notice::PR is closed or from a fork; skipping."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          { echo "pr=$N"; echo "head_ref=$(jq -r .headRefName pr.json)"; echo "head_sha=$(jq -r .headRefOid pr.json)"; } >> "$GITHUB_OUTPUT"

      - id: adapter
        if: ${{ steps.pr.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PIPELINE_BOT_LOGIN: ${{ vars.PIPELINE_BOT_LOGIN }}
          # Findings the owner dispositioned are not fixed.
          PIPELINE_OWNER_LOGIN: ${{ vars.PIPELINE_OWNER_LOGIN }}
          # Only shapes the state table.
          REQUIRE_COPILOT: ${{ vars.REQUIRE_COPILOT }}
          MODE: ${{ inputs.retry && 'retry' || 'normal' }}
          PR: ${{ steps.pr.outputs.pr }}
        run: node .github/scripts/pipeline.mjs fix-adapter "$PR" "$RUNNER_TEMP/items.json" "$MODE"

      - if: ${{ steps.adapter.outputs.action == 'fix' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fix-items
          path: ${{ runner.temp }}/items.json
          retention-days: 7

  fix:
    needs: adapter
    if: ${{ needs.adapter.outputs.action == 'fix' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: pipeline-pr-${{ needs.adapter.outputs.pr }}-fix
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    outputs:
      summary: ${{ steps.gemini.outputs.summary }}
      prompt_version: ${{ steps.prompt.outputs.version }}
      patch_rejected: ${{ steps.guard.outputs.rejected }}
      # none | approvable | forbidden (check-patch): tells the two hard gates apart.
      patch_protected: ${{ steps.guard.outputs.protected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.adapter.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .pipeline/trusted
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/prompts

      # No `pnpm install` here: this job holds GEMINI_API_KEY and the agent
      # has no shell, so nothing needs node_modules. The verify job runs
      # the checks without secrets.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fix-items
          path: .pipeline

      - name: Collect diff (untrusted data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr diff "${{ needs.adapter.outputs.pr }}" --repo "$GITHUB_REPOSITORY" > .pipeline/pr.diff

      - id: prompt
        run: |
          node .pipeline/trusted/.github/scripts/pipeline.mjs render-prompt \
            --prompt .pipeline/trusted/.github/prompts/fix.md --output prompt \
            --context "repository=$GITHUB_REPOSITORY" \
            --context "pull request=#${{ needs.adapter.outputs.pr }}" \
            --context "fix loop=${{ needs.adapter.outputs.loop }} of 2" \
            --data review_items=.pipeline/items.json \
            --data diff=.pipeline/pr.diff

      # Step-level `env:` on the run-gemini-cli step itself does not reliably
      # reach that composite action's own internal steps; $GITHUB_ENV is the
      # documented way to make a var visible to every later step in the job.
      # Pipeline PRs and trusted feedback only (adapter job), and the CLI is
      # scoped to file tools (settings below). No run_shell_command: review
      # comments are attacker-reachable text, and any shell child would
      # inherit the API key.
      - name: Trust the workspace for Gemini CLI
        run: echo "GEMINI_CLI_TRUST_WORKSPACE=true" >> "$GITHUB_ENV"

      - id: gemini
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          settings: |
            {
              "tools": { "core": ["read_file", "read_many_files", "list_directory", "glob", "search_file_content", "write_file", "replace"] },
              "telemetry": { "enabled": false },
              "privacy": { "usageStatisticsEnabled": false }
            }

      - name: Package edits as a patch
        run: |
          # Undo the Gemini action's own files (settings, commands).
          git checkout -- .gemini 2>/dev/null || true
          git clean -fdq -- .gemini
          mv .pipeline/trusted "$RUNNER_TEMP/trusted"
          rm -rf .pipeline gemini-artifacts
          git add -A
          mkdir -p "$RUNNER_TEMP/out"
          git -c core.quotePath=false diff --cached --binary > "$RUNNER_TEMP/out/fix.patch"
          test -s "$RUNNER_TEMP/out/fix.patch" || { echo "::error::The fixer made no changes"; exit 1; }

      # A rejected patch is a hard gate (forbidden_path, or protected_approval_needed
      # when its protected paths are all approvable), not an agent error.
      - id: guard
        run: |
          if ! node "$RUNNER_TEMP/trusted/.github/scripts/pipeline.mjs" check-patch "$RUNNER_TEMP/out/fix.patch"; then
            echo "rejected=true" >> "$GITHUB_OUTPUT"; exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fix-patch
          path: ${{ runner.temp }}/out/fix.patch
          retention-days: 7

  # Runs the repo's checks on the patched tree. PR code executes here, so
  # this job gets no secrets and a read-only token.
  verify:
    needs: [adapter, fix]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pipeline-pr-${{ needs.adapter.outputs.pr }}-fix-verify
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.adapter.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .pipeline/trusted
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            .github/scripts

      # Installs from the PR head's lockfile; the patch cannot change it
      # (check-patch rejects package manifests and the lockfile).
      - uses: ./.pipeline/trusted/.github/actions/setup

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fix-patch
          path: ${{ runner.temp }}/in

      - name: Apply the patch
        run: |
          mv .pipeline/trusted "$RUNNER_TEMP/trusted"
          rm -rf .pipeline
          node "$RUNNER_TEMP/trusted/.github/scripts/pipeline.mjs" check-patch "$RUNNER_TEMP/in/fix.patch"
          git apply --index "$RUNNER_TEMP/in/fix.patch"

      # The agent cannot run the formatter, so format here and ship the
      # formatted patch. The push job checks it again before pushing.
      - name: Format and verify
        run: |
          pnpm format
          pnpm verify
          git add -A
          mkdir -p "$RUNNER_TEMP/out"
          git -c core.quotePath=false diff --cached --binary HEAD > "$RUNNER_TEMP/out/verified.patch"
          node "$RUNNER_TEMP/trusted/.github/scripts/pipeline.mjs" check-patch "$RUNNER_TEMP/out/verified.patch"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fix-verified
          path: ${{ runner.temp }}/out/verified.patch
          retention-days: 7

  push:
    needs: [adapter, fix, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pipeline-pr-${{ needs.adapter.outputs.pr }}-fix-push
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # App token so the push re-triggers CI; no `workflows` permission.
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PIPELINE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.adapter.outputs.head_ref }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .pipeline/trusted
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fix-*
          path: .pipeline/in
          merge-multiple: true

      - name: Commit and push
        id: push
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_SHA: ${{ needs.adapter.outputs.head_sha }}
          HEAD_REF: ${{ needs.adapter.outputs.head_ref }}
          LOOP: ${{ needs.adapter.outputs.loop }}
          SUMMARY: ${{ needs.fix.outputs.summary }}
          VERSION: ${{ needs.fix.outputs.prompt_version }}
        run: |
          node .pipeline/trusted/.github/scripts/pipeline.mjs check-patch .pipeline/in/verified.patch
          if [[ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]]; then
            echo "::error::Branch moved since the review; not pushing a stale fix."; exit 1
          fi
          git apply --index .pipeline/in/verified.patch
          git config user.name "pipeline-agent"
          git config user.email "pipeline-agent@users.noreply.github.com"
          printf 'Address review feedback (fix loop %s)\n\n%s\n\nGenerated by Gemini with prompt fix.md@%s.\n' \
            "$LOOP" "$(printf '%s' "$SUMMARY" | head -c 4000)" "$VERSION" > msg.txt
          git commit -F msg.txt
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$HEAD_REF"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reply to review threads
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PIPELINE_BOT_LOGIN: ${{ vars.PIPELINE_BOT_LOGIN }}
        run: node .pipeline/trusted/.github/scripts/pipeline.mjs fix-reply "${{ needs.adapter.outputs.pr }}" "${{ steps.push.outputs.sha }}" .pipeline/in/items.json

      - name: Outcome note
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ needs.adapter.outputs.pr }}
          LOOP: ${{ needs.adapter.outputs.loop }}
          SHA: ${{ steps.push.outputs.sha }}
          VERSION: ${{ needs.fix.outputs.prompt_version }}
        run: |
          jq -n --arg s "Fix round $LOOP pushed as ${SHA:0:7}." --arg v "fix.md@$VERSION" \
            '{stage: "fix", result: "success", summary: $s, prompt_version: $v}' > "$RUNNER_TEMP/outcome.json"
          node .pipeline/trusted/.github/scripts/pipeline.mjs outcome "$N" "$RUNNER_TEMP/outcome.json"

  report:
    needs: [adapter, fix, verify, push]
    if: ${{ always() && needs.adapter.outputs.action == 'fix' && (needs.fix.result != 'success' || needs.verify.result != 'success' || needs.push.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PIPELINE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-issues: write

      - name: Report the problem to the router (stage:routing)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ needs.adapter.outputs.pr }}
          FIX: ${{ needs.fix.result }}
          VERIFY: ${{ needs.verify.result }}
          PUSH: ${{ needs.push.result }}
          REJECTED: ${{ needs.fix.outputs.patch_rejected }}
          PROTECTED: ${{ needs.fix.outputs.patch_protected }}
          VERSION: ${{ needs.fix.outputs.prompt_version }}
        run: |
          node .github/scripts/pipeline.mjs classify fix --job-result "$FIX" --verify-result "$VERIFY" --push-result "$PUSH" \
            --patch-rejected "${REJECTED:-false}" --patch-protected "${PROTECTED:-none}" \
            --prompt-version "fix.md@${VERSION:-unknown}" --out outcome.json
          node .github/scripts/pipeline.mjs outcome "$N" outcome.json
