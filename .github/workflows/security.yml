name: Pipeline · Security Review

# After CI passes on a PR: Gemini reviews the diff for security and
# correctness. A deterministic job parses its JSON, posts a PR review
# (blocking findings as inline threads), sets the `pipeline/security`
# commit status and labels stage:reviewing. Findings feed fix.yml.
# After CI fails on a pipeline PR (problem `ci_failed`): park the PR in
# stage:needs-attention with a notice linking the run.
# W5 (docs/security.md): consumes no artifacts, runs only for same-repo PRs,
# never executes PR code, and loads prompts/scripts from the default branch.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  review:
    # Same-repo PRs only: fork PRs never reach agents with secrets.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gemini quota: every job that calls run-gemini-cli shares this one group
    # (security.yml review, fix.yml fix), so a burst queues (FIFO, up to 100
    # pending) instead of running in parallel. `queue: max` matters: by
    # default a group keeps one pending run and cancels the older pending one.
    # It also rules out cancel-in-progress, so a stale head is skipped by the
    # `fresh` step when its turn comes, not cancelled while waiting.
    concurrency:
      group: pipeline-gemini
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    outputs:
      response: ${{ steps.gemini.outputs.summary }}
      prompt_version: ${{ steps.prompt.outputs.version }}
      pr: ${{ github.event.workflow_run.pull_requests[0].number }}
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Code is read by the agent as data only; nothing from the PR is executed here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # The prompt and scripts always come from the default branch, never the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .pipeline/trusted
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/prompts

      - name: Collect PR and diff (untrusted data)
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          gh pr view "$N" --repo "$GITHUB_REPOSITORY" --json number,title,body,author,headRefName,baseRefName,files > .pipeline/pr.json
          gh pr diff "$N" --repo "$GITHUB_REPOSITORY" > .pipeline/pr.diff

      - id: prompt
        env:
          N: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node .pipeline/trusted/.github/scripts/pipeline.mjs render-prompt \
            --prompt .pipeline/trusted/.github/prompts/security-review.md --output prompt \
            --context "repository=$GITHUB_REPOSITORY" \
            --context "pull request=#$N" \
            --context "head commit=$SHA" \
            --data pr=.pipeline/pr.json \
            --data diff=.pipeline/pr.diff

      # The job may have waited in the pipeline-gemini queue while the PR
      # moved on. A review of an older head is worthless (security-publish
      # skips it), so do not spend Gemini quota on it.
      - id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$N" --jq .head.sha)"
          if [[ "$head" == "$SHA" ]]; then echo "stale=false" >> "$GITHUB_OUTPUT"; else echo "stale=true" >> "$GITHUB_OUTPUT"; echo "Head moved to $head; skipping the Gemini review of $SHA."; fi

      # Step-level `env:` on the run-gemini-cli step itself does not reliably
      # reach that composite action's own internal steps; $GITHUB_ENV is the
      # documented way to make a var visible to every later step in the job.
      # Same-repo PRs only (job's if:), and the CLI is restricted to
      # read-only tools (settings below).
      - name: Trust the workspace for Gemini CLI
        if: ${{ steps.fresh.outputs.stale != 'true' }}
        run: echo "GEMINI_CLI_TRUST_WORKSPACE=true" >> "$GITHUB_ENV"

      - id: gemini
        if: ${{ steps.fresh.outputs.stale != 'true' }}
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          settings: |
            {
              "tools": { "core": ["read_file", "read_many_files", "list_directory", "glob", "search_file_content"] },
              "telemetry": { "enabled": false },
              "privacy": { "usageStatisticsEnabled": false }
            }

  publish:
    needs: review
    if: ${{ always() && needs.review.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pipeline-pr-${{ github.event.workflow_run.pull_requests[0].number }}-security-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      # App token: a review posted with GITHUB_TOKEN would not trigger fix.yml.
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PIPELINE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-issues: write
          permission-statuses: write

      - name: Post review, status and label
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RESPONSE: ${{ needs.review.outputs.response }}
          VERSION: ${{ needs.review.outputs.prompt_version }}
          REVIEW_RESULT: ${{ needs.review.result }}
          PIPELINE_BOT_LOGIN: ${{ vars.PIPELINE_BOT_LOGIN }}
        run: |
          if [[ "$REVIEW_RESULT" != "success" ]]; then RESPONSE="reviewer run failed ($REVIEW_RESULT)"; fi
          printf '%s\n' "$RESPONSE" > response.md
          node .github/scripts/pipeline.mjs security-publish "$N" "$SHA" response.md "${VERSION:-unknown}"

  # Problem `ci_failed` (PROBLEMS in pipeline-lib.mjs). The router will
  # route it later; for now a failed CI run parks a pipeline PR for a human.
  ci-failed:
    if: >-
      vars.PIPELINE_APP_CLIENT_ID != '' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pipeline-pr-${{ github.event.workflow_run.pull_requests[0].number }}-ci-failed
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PIPELINE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-issues: write

      # Pipeline PRs only, and only for the PR's current head (checked in the script).
      - name: Park the PR in stage:needs-attention
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PIPELINE_BOT_LOGIN: ${{ vars.PIPELINE_BOT_LOGIN }}
          N: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: node .github/scripts/pipeline.mjs ci-failed "$N" "$SHA" "$RUN_URL"
