name: Pipeline · Security Review

# After CI passes on a PR: Gemini reviews the diff for security and
# correctness. A deterministic job parses its JSON, posts a PR review
# (blocking findings as inline threads), sets the `pipeline/security`
# commit status and labels stage:reviewing. Findings feed fix.yml.
# W5 (docs/security.md): consumes no artifacts, runs only for same-repo PRs,
# never executes PR code, and loads prompts/scripts from the default branch.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  review:
    # Same-repo PRs only: fork PRs never reach agents with secrets.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pipeline-pr-${{ github.event.workflow_run.pull_requests[0].number }}-security
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      response: ${{ steps.gemini.outputs.summary }}
      prompt_version: ${{ steps.prompt.outputs.version }}
      pr: ${{ github.event.workflow_run.pull_requests[0].number }}
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Code is read by the agent as data only; nothing from the PR is executed here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # The prompt and scripts always come from the default branch, never the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .pipeline/trusted
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/prompts

      - name: Collect PR and diff (untrusted data)
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          gh pr view "$N" --repo "$GITHUB_REPOSITORY" --json number,title,body,author,headRefName,baseRefName,files > .pipeline/pr.json
          gh pr diff "$N" --repo "$GITHUB_REPOSITORY" > .pipeline/pr.diff

      - id: prompt
        env:
          N: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node .pipeline/trusted/.github/scripts/pipeline.mjs render-prompt \
            --prompt .pipeline/trusted/.github/prompts/security-review.md --output prompt \
            --context "repository=$GITHUB_REPOSITORY" \
            --context "pull request=#$N" \
            --context "head commit=$SHA" \
            --data pr=.pipeline/pr.json \
            --data diff=.pipeline/pr.diff

      - id: gemini
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          # Same-repo PRs only (job's if:), and the CLI is restricted to
          # read-only tools (settings below); matches the official
          # run-gemini-cli example workflows' step-level placement.
          GEMINI_CLI_TRUST_WORKSPACE: true
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          settings: |
            {
              "tools": { "core": ["read_file", "read_many_files", "list_directory", "glob", "search_file_content"] },
              "telemetry": { "enabled": false },
              "privacy": { "usageStatisticsEnabled": false }
            }

  publish:
    needs: review
    if: ${{ always() && needs.review.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pipeline-pr-${{ github.event.workflow_run.pull_requests[0].number }}-security-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      # App token: a review posted with GITHUB_TOKEN would not trigger fix.yml.
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PIPELINE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-issues: write
          permission-statuses: write

      - name: Post review, status and label
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RESPONSE: ${{ needs.review.outputs.response }}
          VERSION: ${{ needs.review.outputs.prompt_version }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: |
          if [[ "$REVIEW_RESULT" != "success" ]]; then RESPONSE="reviewer run failed ($REVIEW_RESULT)"; fi
          printf '%s\n' "$RESPONSE" > response.md
          node .github/scripts/pipeline.mjs security-publish "$N" "$SHA" response.md "${VERSION:-unknown}"
