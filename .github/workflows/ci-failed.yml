name: Pipeline · CI Failed

# After CI fails on a pipeline PR's head (problem `ci_failed`): park the PR in
# stage:needs-attention with a notice linking the run.
# W5 (docs/security.md): consumes no artifacts, runs only for same-repo PRs,
# never executes PR code, and loads scripts from the default branch.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  # Problem `ci_failed` (PROBLEMS in pipeline-lib.mjs). The router will
  # route it later; for now a failed CI run parks a pipeline PR for a human.
  ci-failed:
    if: >-
      vars.PIPELINE_APP_CLIENT_ID != '' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pipeline-pr-${{ github.event.workflow_run.pull_requests[0].number }}-ci-failed
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PIPELINE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-issues: write

      # Pipeline PRs only, and only for the PR's current head (checked in the script).
      - name: Park the PR in stage:needs-attention
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PIPELINE_BOT_LOGIN: ${{ vars.PIPELINE_BOT_LOGIN }}
          N: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: node .github/scripts/pipeline.mjs ci-failed "$N" "$SHA" "$RUN_URL"
