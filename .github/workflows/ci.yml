name: CI

# The required check (job name `ci`) for the main ruleset. Deterministic
# gate in front of every AI step: nothing an agent writes reaches review,
# preview or a human until this is green. Also reused by deploy.yml.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pipeline-pr-${{ github.event.pull_request.number || github.run_id }}-ci
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Fails if TS project references weren't committed after `nx sync`.
      - name: Nx sync check
        run: pnpm nx sync:check

      - name: Format check
        run: pnpm nx format:check --all

      - name: Lint
        run: pnpm nx run-many -t lint

      - name: Typecheck
        run: pnpm nx run-many -t typecheck

      - name: Unit tests
        run: pnpm nx run-many -t test

      - name: Pipeline script tests
        run: pnpm test:pipeline

      - name: Build
        run: pnpm nx run-many -t build

      - name: Playwright (apps/site)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm nx run site-e2e:e2e

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/site-e2e/test-output/playwright/
          retention-days: 7
