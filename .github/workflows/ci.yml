name: CI

# Runs on PRs, on demand, and as the first job of every deploy to main.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails if TS project references weren't committed after `nx sync`.
      - run: pnpm nx sync:check

      - run: pnpm verify

      - name: E2E
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/site-e2e/test-output/playwright/
          retention-days: 7
