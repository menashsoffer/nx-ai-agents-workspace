name: Pipeline · Plan

# stage:spec -> Claude (CTO) writes an implementation plan against this Nx
# workspace -> comment -> stage:planned, or stage:needs-attention when
# information is missing. The agent is read-only; a deterministic job posts.
on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  plan:
    if: ${{ github.event.label.name == 'stage:spec' && !github.event.issue.pull_request && github.event.issue.state == 'open' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pipeline-issue-${{ github.event.issue.number }}-plan
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    outputs:
      result: ${{ steps.claude.outputs.structured_output }}
      prompt_version: ${{ steps.prompt.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect issue, spec and comments (untrusted data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .pipeline
          gh issue view "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,author,labels,comments > .pipeline/issue.json

      - id: prompt
        run: |
          node .github/scripts/pipeline.mjs render-prompt \
            --prompt .github/prompts/plan.md --output prompt \
            --context "repository=$GITHUB_REPOSITORY" \
            --context "issue=#${{ github.event.issue.number }}" \
            --data issue=.pipeline/issue.json

      - id: claude
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          github_token: ${{ github.token }}
          allowed_bots: ${{ vars.PIPELINE_BOT_LOGIN }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep"
            --disallowedTools "Bash,Edit,MultiEdit,Write,NotebookEdit,WebFetch,WebSearch"
            --json-schema '{"type":"object","additionalProperties":false,"required":["status","plan","missing_information"],"properties":{"status":{"type":"string","enum":["planned","needs-attention"]},"plan":{"type":"string"},"missing_information":{"type":"array","items":{"type":"string"}}}}'

  publish:
    needs: plan
    if: ${{ always() && needs.plan.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pipeline-issue-${{ github.event.issue.number }}-plan-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PIPELINE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Post plan and set stage
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
          RESULT: ${{ needs.plan.outputs.result }}
          VERSION: ${{ needs.plan.outputs.prompt_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          status=$(jq -r '.status // "invalid"' <<<"${RESULT:-null}" 2>/dev/null || echo invalid)
          plan=$(jq -r '.plan // ""' <<<"${RESULT:-null}" 2>/dev/null || true)
          if [[ "$status" == "planned" && -n "$plan" ]]; then
            { echo "### Implementation plan"; echo; printf '%s\n' "$plan"; echo;
              echo "<sub>Generated by Claude with prompt plan.md@$VERSION. Development starts automatically (stage:planned).</sub>"; } > body.md
            node .github/scripts/pipeline.mjs upsert-comment "$N" plan body.md
            node .github/scripts/pipeline.mjs set-stage "$N" stage:planned
          else
            { echo "**Planning needs attention.** Please answer, edit the issue or spec, then re-add \`stage:spec\`."; echo;
              jq -r '.missing_information[]? | "- " + .' <<<"${RESULT:-null}" 2>/dev/null || true
              if [[ "$status" == "invalid" ]]; then echo "- The planner failed or returned invalid output: $RUN_URL"; fi; } > body.md
            node .github/scripts/pipeline.mjs upsert-comment "$N" notice body.md
            node .github/scripts/pipeline.mjs set-stage "$N" stage:needs-attention
          fi
