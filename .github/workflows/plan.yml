name: Pipeline · Plan

# stage:qualified -> one Claude run (read-only) writes a spec AND an
# implementation plan against this Nx workspace. A deterministic job runs the
# auto-approval checks (pipeline-lib evaluatePlanApproval: schema, testable
# criteria, scope, size, no embedded instructions). All pass: it posts the
# two comments (pipeline:spec, pipeline:plan), appends a success outcome
# note and sets stage:planned. Any check fails, or the agent reports a
# problem or the run fails: it appends a problem outcome note and sets
# stage:routing instead. (This replaces the old Gemini spec.yml.)
on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  plan:
    if: ${{ github.event.label.name == 'stage:qualified' && !github.event.issue.pull_request && github.event.issue.state == 'open' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pipeline-issue-${{ github.event.issue.number }}-plan
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    outputs:
      result: ${{ steps.claude.outputs.structured_output }}
      prompt_version: ${{ steps.prompt.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Earlier spec/plan come only from the pipeline bot's marker comments.
      - name: Collect issue, earlier spec/plan and comments (untrusted data)
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_BOT_LOGIN: ${{ vars.PIPELINE_BOT_LOGIN }}
          N: ${{ github.event.issue.number }}
        run: |
          mkdir -p .pipeline
          node .github/scripts/pipeline.mjs collect-issue "$N" .pipeline/issue.json

      - id: prompt
        env:
          BOT: ${{ vars.PIPELINE_BOT_LOGIN }}
        run: |
          node .github/scripts/pipeline.mjs render-prompt \
            --prompt .github/prompts/plan.md --output prompt \
            --context "repository=$GITHUB_REPOSITORY" \
            --context "issue=#${{ github.event.issue.number }}" \
            --context "pipeline bot login=$BOT" \
            --data issue=.pipeline/issue.json

      - id: claude
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          github_token: ${{ github.token }}
          allowed_bots: ${{ vars.PIPELINE_BOT_LOGIN }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep"
            --disallowedTools "Bash,Edit,MultiEdit,Write,NotebookEdit,WebFetch,WebSearch"
            --json-schema '{"type":"object","additionalProperties":false,"required":["status","problem","questions","details","signals","spec","plan"],"properties":{"status":{"type":"string","enum":["planned","problem"]},"problem":{"type":"string","enum":["none","spec_questions","scope_split","protected_surface","needs_secrets_ci_infra","embedded_instructions"]},"questions":{"type":"array","items":{"type":"string"}},"details":{"type":"array","items":{"type":"string"}},"signals":{"type":"object","additionalProperties":false,"required":["embedded_instructions","needs_secrets_ci_infra"],"properties":{"embedded_instructions":{"type":"boolean"},"needs_secrets_ci_infra":{"type":"boolean"}}},"spec":{"type":"object","additionalProperties":false,"required":["goal","acceptance_criteria","rtl_accessibility","test_plan","out_of_scope","assumptions"],"properties":{"goal":{"type":"string"},"acceptance_criteria":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["text","testable"],"properties":{"text":{"type":"string"},"testable":{"type":"boolean"}}}},"rtl_accessibility":{"type":"string"},"test_plan":{"type":"string"},"out_of_scope":{"type":"string"},"assumptions":{"type":"string"}}},"plan":{"type":"object","additionalProperties":false,"required":["approach","changes","tests","risks","definition_of_done"],"properties":{"approach":{"type":"string"},"changes":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["project","file","change","lines"],"properties":{"project":{"type":"string"},"file":{"type":"string"},"change":{"type":"string"},"lines":{"type":"integer","minimum":0}}}},"tests":{"type":"string"},"risks":{"type":"string"},"definition_of_done":{"type":"string"}}}}}'

  publish:
    needs: plan
    if: ${{ always() && needs.plan.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pipeline-issue-${{ github.event.issue.number }}-plan-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PIPELINE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          permission-issues: write

      - id: classify
        env:
          RESULT: ${{ needs.plan.outputs.result }}
          JOB_RESULT: ${{ needs.plan.result }}
          VERSION: ${{ needs.plan.outputs.prompt_version }}
        run: |
          printf '%s' "$RESULT" > result.json
          node .github/scripts/pipeline.mjs classify plan --job-result "$JOB_RESULT" \
            --result result.json --prompt-version "plan.md@${VERSION:-unknown}" --out outcome.json \
            --spec-out spec-comment.md --plan-out plan-comment.md

      - name: Post spec and plan, then move to stage:planned
        if: ${{ steps.classify.outputs.result == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
          PIPELINE_BOT_LOGIN: ${{ vars.PIPELINE_BOT_LOGIN }}
        run: |
          node .github/scripts/pipeline.mjs upsert-comment "$N" spec spec-comment.md
          node .github/scripts/pipeline.mjs upsert-comment "$N" plan plan-comment.md
          node .github/scripts/pipeline.mjs outcome "$N" outcome.json
          node .github/scripts/pipeline.mjs set-stage "$N" stage:planned

      - name: Report the problem to the router (stage:routing)
        if: ${{ steps.classify.outputs.result == 'problem' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
        run: node .github/scripts/pipeline.mjs outcome "$N" outcome.json
