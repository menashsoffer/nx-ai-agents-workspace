name: Pipeline · Plan

# stage:spec -> Claude (CTO) writes an implementation plan against this Nx
# workspace -> comment + outcome note -> stage:planned. When it cannot plan
# (spec problems, hard gates, a failed run) it appends an outcome note and
# sets stage:routing instead. The agent is read-only; a deterministic job posts.
on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  plan:
    if: ${{ github.event.label.name == 'stage:spec' && !github.event.issue.pull_request && github.event.issue.state == 'open' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pipeline-issue-${{ github.event.issue.number }}-plan
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    outputs:
      result: ${{ steps.claude.outputs.structured_output }}
      prompt_version: ${{ steps.prompt.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect issue, spec and comments (untrusted data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .pipeline
          gh issue view "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,author,labels,comments > .pipeline/issue.json

      - id: prompt
        env:
          BOT: ${{ vars.PIPELINE_BOT_LOGIN }}
        run: |
          node .github/scripts/pipeline.mjs render-prompt \
            --prompt .github/prompts/plan.md --output prompt \
            --context "repository=$GITHUB_REPOSITORY" \
            --context "issue=#${{ github.event.issue.number }}" \
            --context "pipeline bot login=$BOT" \
            --data issue=.pipeline/issue.json

      - id: claude
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          github_token: ${{ github.token }}
          allowed_bots: ${{ vars.PIPELINE_BOT_LOGIN }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep"
            --disallowedTools "Bash,Edit,MultiEdit,Write,NotebookEdit,WebFetch,WebSearch"
            --json-schema '{"type":"object","additionalProperties":false,"required":["status","plan","problem","questions","details"],"properties":{"status":{"type":"string","enum":["planned","problem"]},"plan":{"type":"string"},"problem":{"type":"string","enum":["none","spec_missing","spec_questions","untestable_criteria","protected_surface","needs_secrets_ci_infra","scope_split","embedded_instructions"]},"questions":{"type":"array","items":{"type":"string"}},"details":{"type":"array","items":{"type":"string"}}}}'

  publish:
    needs: plan
    if: ${{ always() && needs.plan.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pipeline-issue-${{ github.event.issue.number }}-plan-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PIPELINE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          permission-issues: write

      - id: classify
        env:
          RESULT: ${{ needs.plan.outputs.result }}
          JOB_RESULT: ${{ needs.plan.result }}
          VERSION: ${{ needs.plan.outputs.prompt_version }}
        run: |
          printf '%s' "$RESULT" > result.json
          node .github/scripts/pipeline.mjs classify plan --job-result "$JOB_RESULT" \
            --result result.json --prompt-version "plan.md@${VERSION:-unknown}" --out outcome.json

      - name: Post plan and move to stage:planned
        if: ${{ steps.classify.outputs.result == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
          VERSION: ${{ needs.plan.outputs.prompt_version }}
        run: |
          { echo "### Implementation plan"; echo; jq -r '.plan' result.json; echo;
            echo "<sub>Generated by Claude with prompt plan.md@$VERSION. Development starts automatically (stage:planned).</sub>"; } > body.md
          node .github/scripts/pipeline.mjs upsert-comment "$N" plan body.md
          node .github/scripts/pipeline.mjs outcome "$N" outcome.json
          node .github/scripts/pipeline.mjs set-stage "$N" stage:planned

      - name: Report the problem to the router (stage:routing)
        if: ${{ steps.classify.outputs.result == 'problem' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
        run: node .github/scripts/pipeline.mjs outcome "$N" outcome.json
