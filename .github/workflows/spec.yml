name: Pipeline · Spec

# stage:qualified -> Claude writes a structured spec -> comment + outcome
# note -> stage:spec. On a problem (agent_error: the run failed or returned
# nothing; invalid_output: required sections missing) it appends an outcome
# note and sets stage:routing instead. The agent job holds no GitHub write
# token; a deterministic job classifies the output and posts it.
on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  spec:
    if: ${{ github.event.label.name == 'stage:qualified' && !github.event.issue.pull_request && github.event.issue.state == 'open' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pipeline-issue-${{ github.event.issue.number }}-spec
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    outputs:
      spec: ${{ steps.claude.outputs.structured_output }}
      prompt_version: ${{ steps.prompt.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect issue (untrusted data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .pipeline
          gh issue view "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,author,labels,comments > .pipeline/issue.json

      - id: prompt
        env:
          BOT: ${{ vars.PIPELINE_BOT_LOGIN }}
        run: |
          node .github/scripts/pipeline.mjs render-prompt \
            --prompt .github/prompts/spec.md --output prompt \
            --context "repository=$GITHUB_REPOSITORY" \
            --context "issue=#${{ github.event.issue.number }}" \
            --context "pipeline bot login=$BOT" \
            --data issue=.pipeline/issue.json

      - id: claude
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          github_token: ${{ github.token }}
          allowed_bots: ${{ vars.PIPELINE_BOT_LOGIN }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep"
            --disallowedTools "Bash,Edit,MultiEdit,Write,NotebookEdit,WebFetch,WebSearch"
            --json-schema '{"type":"object","additionalProperties":false,"required":["spec"],"properties":{"spec":{"type":"string"}}}'

  publish:
    needs: spec
    if: ${{ always() && needs.spec.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pipeline-issue-${{ github.event.issue.number }}-spec-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # App token: label changes made with GITHUB_TOKEN would not trigger plan.yml.
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PIPELINE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          permission-issues: write

      - id: classify
        env:
          SPEC: ${{ fromJSON(needs.spec.outputs.spec || '{}').spec }}
          JOB_RESULT: ${{ needs.spec.result }}
          VERSION: ${{ needs.spec.outputs.prompt_version }}
        run: |
          printf '%s\n' "$SPEC" > spec.md
          node .github/scripts/pipeline.mjs classify spec --job-result "$JOB_RESULT" \
            --output spec.md --prompt-version "spec.md@${VERSION:-unknown}" --out outcome.json

      - name: Post spec and move to stage:spec
        if: ${{ steps.classify.outputs.result == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
          VERSION: ${{ needs.spec.outputs.prompt_version }}
          PIPELINE_BOT_LOGIN: ${{ vars.PIPELINE_BOT_LOGIN }}
        run: |
          { echo "### Spec"; echo; cat spec.md; echo; echo "<sub>Generated by Claude with prompt spec.md@$VERSION. Edit this spec if needed, then re-add stage:spec to re-plan.</sub>"; } > body.md
          node .github/scripts/pipeline.mjs upsert-comment "$N" spec body.md
          node .github/scripts/pipeline.mjs outcome "$N" outcome.json
          node .github/scripts/pipeline.mjs set-stage "$N" stage:spec

      - name: Report the problem to the router (stage:routing)
        if: ${{ steps.classify.outputs.result == 'problem' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
        run: node .github/scripts/pipeline.mjs outcome "$N" outcome.json
