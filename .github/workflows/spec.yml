name: Pipeline · Spec

# stage:qualified -> Gemini writes a structured spec -> comment -> stage:spec.
# The agent job holds no GitHub write token; a deterministic job validates
# the output and posts it.
on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  spec:
    if: ${{ github.event.label.name == 'stage:qualified' && !github.event.issue.pull_request && github.event.issue.state == 'open' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pipeline-issue-${{ github.event.issue.number }}-spec
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    outputs:
      spec: ${{ steps.gemini.outputs.summary }}
      prompt_version: ${{ steps.prompt.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect issue (untrusted data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .pipeline
          gh issue view "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,author,labels,comments > .pipeline/issue.json

      - id: prompt
        run: |
          node .github/scripts/pipeline.mjs render-prompt \
            --prompt .github/prompts/spec.md --output prompt \
            --context "repository=$GITHUB_REPOSITORY" \
            --context "issue=#${{ github.event.issue.number }}" \
            --data issue=.pipeline/issue.json

      - id: gemini
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          # Same-repo issue content only, and the CLI is restricted to
          # read-only tools (settings below); matches the official
          # run-gemini-cli example workflows' step-level placement.
          GEMINI_CLI_TRUST_WORKSPACE: true
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          settings: |
            {
              "tools": { "core": ["read_file", "read_many_files", "list_directory", "glob", "search_file_content"] },
              "telemetry": { "enabled": false },
              "privacy": { "usageStatisticsEnabled": false }
            }

  publish:
    needs: spec
    if: ${{ always() && needs.spec.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pipeline-issue-${{ github.event.issue.number }}-spec-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # App token: label changes made with GITHUB_TOKEN would not trigger plan.yml.
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PIPELINE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          permission-issues: write

      - id: check
        env:
          SPEC: ${{ needs.spec.outputs.spec }}
        run: |
          printf '%s\n' "$SPEC" > spec.md
          node .github/scripts/pipeline.mjs validate-spec spec.md

      - name: Post spec and move to stage:spec
        if: ${{ needs.spec.result == 'success' && steps.check.outputs.ok == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
          VERSION: ${{ needs.spec.outputs.prompt_version }}
        run: |
          { echo "### Spec"; echo; cat spec.md; echo; echo "<sub>Generated by Gemini with prompt spec.md@$VERSION. Edit this spec if needed, then re-add stage:spec to re-plan.</sub>"; } > body.md
          node .github/scripts/pipeline.mjs upsert-comment "$N" spec body.md
          node .github/scripts/pipeline.mjs set-stage "$N" stage:spec

      - name: Needs attention
        if: ${{ needs.spec.result != 'success' || steps.check.outputs.ok != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
          MISSING: ${{ steps.check.outputs.missing }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '**Spec step failed.** Missing sections: %s. See %s\n' "${MISSING:-n/a}" "$RUN_URL" > body.md
          node .github/scripts/pipeline.mjs upsert-comment "$N" notice body.md
          node .github/scripts/pipeline.mjs set-stage "$N" stage:needs-attention
