name: Deploy to GitHub Pages

# Publishes apps/site at / and the ui Storybook at /storybook/ to
# https://<owner>.github.io/<repo>/ via the gh-pages branch, keeping PR
# previews under /pr-<n>/ (see preview.yml and docs/decisions/0004).
# One-time setup: Settings → Pages → Source: "Deploy from a branch",
# branch gh-pages, folder / (root).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm nx run-many -t build build-storybook -p site ui

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r apps/site/dist/. _site/
          mkdir -p _site/storybook
          cp -r libs/ui/storybook-static/. _site/storybook/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: _site
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: _site

      - name: Publish to gh-pages (root)
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/gh-pages-publish.sh root _site
