name: Deploy to GitHub Pages

# Publishes the assembled Pages artifact (apps/site at /, the ui Storybook
# at /storybook/) to the root of the gh-pages branch, keeping PR previews
# under /pr-<n>/ (preview.yml, docs/decisions/0004).
# One-time setup: Settings → Pages → Source: "Deploy from a branch",
# branch gh-pages, folder / (root).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache in the deploy path (cache poisoning).
      - uses: ./.github/actions/setup

      # Same script as the pages-e2e tests: what was tested is what ships.
      - run: pnpm pages:build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages
          path: dist/pages
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages
          path: pages

      - name: Publish to gh-pages (root, keeps pr-*/ previews)
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/gh-pages-publish.sh root pages
