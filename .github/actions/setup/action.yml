name: Setup workspace
description: pnpm + Node from .nvmrc + frozen install.
inputs:
  install:
    description: Run pnpm install --frozen-lockfile.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version from "packageManager"
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
