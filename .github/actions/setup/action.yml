name: Setup workspace
description: Node from .nvmrc, pnpm from "packageManager" via corepack, frozen install. No dependency cache (cache poisoning, docs/security.md).
inputs:
  install:
    description: Run pnpm install --frozen-lockfile.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        package-manager-cache: false
    # pnpm comes from "packageManager" (version + integrity hash) via corepack.
    - shell: bash
      run: corepack enable
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
