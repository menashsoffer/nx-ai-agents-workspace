# Python is used only for the local extraction scripts (coding standards, section 9).
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90", "N", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Hebrew text in strings and comments

[tool.ruff.lint.mccabe]
max-complexity = 10


# Coverage of the extraction scripts (coding standards, section 6). CI fails below 90%.
[tool.coverage.run]
source = ["scripts"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
