packages:
  - 'apps/*'
  - 'libs/*'
  - 'libs/*/*'
  - 'tools/*'

autoInstallPeers: true

# Supply-chain controls (docs/security.md, D5/D6/D8).
# Every dependency with install scripts must be listed: true = may run its
# scripts, false = scripts are skipped. Unlisted ones fail the install.
# Reasons for each entry: docs/security.md (D5).
strictDepBuilds: true
allowBuilds:
  '@swc/core': true
  esbuild: true
  nx: true
  '@parcel/watcher': false
  simple-git-hooks: false
  unrs-resolver: false
# Don't resolve package versions published less than 3 days ago (D6).
minimumReleaseAge: 4320

# Each override carries an advisory ID and a removal condition (D8).
overrides:
  # GHSA-7w5x-hrqm-74c2 (high, DoS). Remove once nx depends on smol-toml >=1.7.1.
  smol-toml: '>=1.7.1'
  # GHSA-c29m-xwm3-cm6r (high, ReDoS) and 11 more, all fixed in 1.20.0. nx pins
  # axios 1.18.1. Remove once nx depends on axios >=1.20.0.
  axios: '^1.20.0'
  # GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p (high, DoS), GHSA-q2hr-2g5m-vwhr
  # (moderate), all fixed in 5.0.12. nx pins brace-expansion 5.0.9. Scoped to 5.x:
  # minimatch 3 and 9 need the unaffected 1.x and 2.x. Remove once nx depends on
  # brace-expansion >=5.0.12.
  'brace-expansion@5.0.9': '5.0.12'
  # GHSA-68fv-2mgg-jv7q (high, event-loop DoS), fixed in 1.2.2. Reached through
  # vite > postcss and tailwindcss, which pin source-map-js 1.2.1. Remove once
  # postcss and @tailwindcss/node depend on source-map-js >=1.2.2.
  source-map-js: '^1.2.2'
